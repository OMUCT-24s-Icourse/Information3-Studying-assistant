<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Information3 Studying Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">Information3</p>
      <h1>定着確認ランダム出題</h1>
      <p class="lead">data/ 内のJSONから、選んだ範囲だけをランダムに出題します。</p>
    </header>

    <main class="layout">
      <section class="panel controls" aria-labelledby="controls-title">
        <div class="panel-header">
          <h2 id="controls-title">出題範囲</h2>
          <p class="panel-note">ON/OFFボタンで対象を切り替えられます。</p>
        </div>

        <div id="sourceList" class="source-list"></div>

        <div class="summary" id="summary">読み込み中...</div>

        <div class="actions">
          <button id="drawButton" class="primary" type="button">出題</button>
          <button id="answerButton" class="ghost" type="button" disabled>回答を表示</button>
        </div>
      </section>

      <section class="panel question" aria-live="polite">
        <div class="question-header">
          <span id="questionTag" class="tag">未出題</span>
          <span id="questionSource" class="source"></span>
        </div>
        <h2 id="questionText" class="question-text">出題ボタンを押してください。</h2>
        <figure id="questionImageBlock" class="question-image hidden">
          <img id="questionImage" alt="" />
        </figure>
        <div id="questionMeta" class="question-meta hidden"></div>

        <div id="choicesBlock" class="choices hidden">
          <h3>選択肢</h3>
          <ol id="choicesList" class="choices-list"></ol>
        </div>

        <div id="answerBlock" class="answer hidden">
          <h3>回答</h3>
          <p id="answerText"></p>
        </div>

        <p id="statusMessage" class="status" role="status"></p>
      </section>
    </main>

    <footer class="footer">
      <p>JSONの書式は README.md を確認してください。</p>
    </footer>
  </div>
  <script src="script.js" defer></script>
</body>

</html>
